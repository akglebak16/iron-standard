# Builds the native battle core (godot/native, a GDExtension) for Windows, Linux and macOS.
# On a branch push the job "commit" puts the fresh binaries into godot/bin/ on that branch; by hand: download the artifacts
# (gh run download <run id> -D /tmp/native) and copy the files into godot/bin/ (see godot/ARCHITECTURE.md).
name: Godot native core
on:
  workflow_dispatch:
  push:
    paths: ['godot/native/**', '.github/workflows/godot-native.yml']
  pull_request:
    paths: ['godot/native/**', '.github/workflows/godot-native.yml']
env:
  GODOT_CPP_REF: 27d9dd23c83871e0619fca5dc2cddfbfd69e926a # branch 4.5
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            extra: ''
          - os: windows-latest
            name: windows
            extra: ''
          - os: macos-latest
            name: macos
            extra: "-DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          ref: ${{ env.GODOT_CPP_REF }}
          path: godot-cpp
      - name: Build
        shell: bash
        run: |
          cmake -S godot/native -B build -DGODOT_CPP_DIR="$PWD/godot-cpp" -DCMAKE_BUILD_TYPE=Release ${{ matrix.extra }}
          cmake --build build --config Release -j 4
          ls -la godot/bin
      - uses: actions/upload-artifact@v4
        with:
          name: battle_core-${{ matrix.name }}
          path: |
            godot/bin/*.so
            godot/bin/*.dll
            godot/bin/*.dylib
          if-no-files-found: error
  # On a branch push the fresh libraries are committed back to that branch (godot/bin/), so a PR carries them.
  commit:
    needs: build
    if: github.event_name != 'pull_request' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/native
      - name: Commit libraries
        run: |
          cp /tmp/native/*/* godot/bin/
          git add godot/bin
          if git diff --cached --quiet; then echo "libraries unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Godot: библиотеки нативного ядра (сборка CI)"
          git push
