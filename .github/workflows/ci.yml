# Сборка, проверка и выкладка игры на GitHub Pages.
# index.html в репозитории не хранится: его собирает этот workflow из src/.
name: Сборка и проверка

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Сборка и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # все ветки — для статусов роудмапа
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Собрать index.html
        run: node build.mjs
      - name: Проверить роудмап
        run: node roadmap/build.mjs --check
      - name: Поставить Playwright
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Тесты в браузере
        run: npm test
      - name: Подготовить сайт
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site && cp index.html docs/trailer-glebio.html _site/ && touch _site/.nojekyll # трейлер: /trailer-glebio.html
          node roadmap/build.mjs --branches _site/roadmap/index.html # доска: /roadmap/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    name: Выложить на GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
