# Каждый PR закрывает свою issue: в описании должна быть строка «Closes #N» (или Fixes/Resolves).
# Тогда GitHub сам закроет issue при слиянии в main, и задачи не остаются висеть.
name: PR — привязка к issue

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  issue-link:
    name: pr-issue-link
    runs-on: ubuntu-latest
    steps:
      - name: В описании есть Closes #N
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -Eiq '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]+(#|https://github\.com/[^[:space:]]+/issues/)[0-9]+'; then
            echo "Issue привязана — закроется при слиянии."
          else
            echo "::error::В описании PR нет «Closes #N». Найди или создай issue и допиши строку «Closes #<номер>», иначе issue не закроется при слиянии."
            exit 1
          fi
