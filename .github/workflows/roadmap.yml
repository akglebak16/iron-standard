# Пуш в ветку с правкой задач роудмапа → пересобрать сайт из main,
# чтобы доска /roadmap/ сразу показала новый статус («в работе», новая задача).
name: Обновить доску роудмапа

on:
  push:
    branches-ignore: [main]
    paths: ['roadmap/tasks/**']
  delete:

permissions:
  actions: write

concurrency:
  group: roadmap-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Запустить «Сборка и проверка» на main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
