name: Godot — архитектура и Windows
on:
  pull_request:
  # После слияния в main тесты не идут: этот запуск только прогревает кеши (импорт, native), чтобы их подхватывали PR.
  # GitHub отдаёт в PR кеши своей ветки и main, но не чужих PR, поэтому без прогрева на main каждый PR импортировал всё с нуля.
  push:
    branches: [main]
    paths:
      - 'godot/**/*.import'
      - 'godot/**/*.png'
      - 'godot/**/*.svg'
      - 'godot/**/*.ogg'
      - 'godot/**/*.wav'
      - 'godot/**/*.ttf'
      - 'godot/**/*.otf'
      - 'godot/**/*.cpp'
      - 'godot/**/*.hpp'
      - 'godot/tools/native_*'
      - '.github/workflows/godot.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'  # раз в сутки полный набор тестов
permissions:
  contents: read
concurrency:
  # Событие в имени группы: прогрев кеша на main не отменяет ночной полный прогон на том же main.
  group: godot-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # В PR гоняем только тесты, до которых доходят изменённые файлы. После слияния в main тесты не идут. Полный набор — раз в сутки и по кнопке.
  changes:
    name: godot-changes
    runs-on: ubuntu-latest
    outputs:
      godot: ${{ steps.f.outputs.godot }}
      warm: ${{ steps.f.outputs.warm }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "push" ]; then
            echo "godot=false" >> "$GITHUB_OUTPUT"; echo "warm=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "warm=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != "pull_request" ]; then
            echo "godot=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          check() { if echo "$files" | grep -qE "$1"; then echo true; else echo false; fi; }
          # godot: любая правка Godot или его workflow, кроме чистой документации
          files=$(echo "$files" | grep -vE '^godot/docs/.*\.md$' || true)
          echo "godot=$(check '^(godot/|\.github/workflows/godot\.yml$)')" >> "$GITHUB_OUTPUT"
  architecture:
    name: godot-architecture
    needs: changes
    if: needs.changes.outputs.godot == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node godot/tools/architecture.test.cjs
      - run: node godot/tools/test_selection.test.cjs
      - run: node godot/tools/test_schedule.test.cjs
      - run: node godot/tools/build_identity.test.cjs
      - name: Архитектура и запрет новых исключений
        env:
          ARCH_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ($env:ARCH_BASE -and $env:ARCH_BASE -ne ('0' * 40)) {
            node godot/tools/architecture.cjs "--base=$env:ARCH_BASE"
          } else {
            node godot/tools/architecture.cjs
          }
  windows:
    name: godot-tests-and-release
    needs: changes
    # warm: запуск на main после слияния, только подготовка и сохранение кешей, без тестов и сборки.
    if: needs.changes.outputs.godot == 'true' || needs.changes.outputs.warm == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Закреплённый Godot и export templates
        shell: pwsh
        run: |
          $version = '4.7.2'
          $base = "https://github.com/godotengine/godot/releases/download/$version-stable"
          Invoke-WebRequest "$base/Godot_v$version-stable_win64.exe.zip" -OutFile "$env:RUNNER_TEMP/godot.zip"
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" "$env:RUNNER_TEMP/godot"
          Invoke-WebRequest "$base/Godot_v$version-stable_export_templates.tpz" -OutFile "$env:RUNNER_TEMP/templates.zip"
          Expand-Archive "$env:RUNNER_TEMP/templates.zip" "$env:RUNNER_TEMP/templates"
          New-Item -ItemType File "$env:RUNNER_TEMP/godot/_sc_" | Out-Null
          $target = "$env:RUNNER_TEMP/godot/editor_data/export_templates/$version.stable"
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item "$env:RUNNER_TEMP/templates/templates/*" $target -Recurse
          "GODOT=$env:RUNNER_TEMP/godot/Godot_v$version-stable_win64_console.exe" >> $env:GITHUB_ENV
      # Кеши восстанавливаются здесь, а сохраняются сразу после подготовки (шаг «Подготовка» ниже), а не в конце задания:
      # упавший тест больше не выбрасывает готовый импорт. Импорт картинок с нуля занимает около двух минут.
      - name: Кеш импорта Godot
        id: cache-import
        uses: actions/cache/restore@v4
        with:
          path: |
            godot/.godot/imported
            godot/.godot/editor
            godot/.godot/uid_cache.bin
            godot/.godot/global_script_class_cache.cfg
            godot/.godot/extension_list.cfg
          key: godot-import-4.7.2-${{ hashFiles('godot/**/*.import', 'godot/**/*.png', 'godot/**/*.svg', 'godot/**/*.ogg', 'godot/**/*.wav', 'godot/**/*.ttf', 'godot/**/*.otf') }}
          restore-keys: |
            godot-import-4.7.2-
      - name: Кеш закреплённых native-инструментов
        id: cache-native-tools
        uses: actions/cache/restore@v4
        with:
          path: dist/godot/native-tools/
          key: native-tools-${{ runner.os }}-${{ hashFiles('godot/tools/native_dependencies.json', 'godot/tools/native_bootstrap.ps1') }}
      - name: Кеш объектов native (fingerprints проверяет native_build)
        id: cache-native-objects
        uses: actions/cache/restore@v4
        with:
          path: |
            dist/godot/native-build/
            godot/adapters/godot/native/bin/
          key: native-objects-${{ runner.os }}-${{ hashFiles('godot/tools/native_dependencies.json', 'godot/tools/native_build.cjs', 'godot/tools/native_bindings.py') }}-${{ hashFiles('godot/**/*.cpp', 'godot/**/*.hpp') }}
          restore-keys: |
            native-objects-${{ runner.os }}-${{ hashFiles('godot/tools/native_dependencies.json', 'godot/tools/native_build.cjs', 'godot/tools/native_bindings.py') }}-
      - name: Кеш длительности тестов (только порядок, не результаты)
        if: needs.changes.outputs.godot == 'true'
        uses: actions/cache@v4
        with:
          path: godot/.godot/test-timings.json
          key: godot-test-times-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            godot-test-times-${{ runner.os }}-
      - name: Пакетное ядро контактов (закреплённые SHA256)
        run: pwsh -File godot/tools/native_bootstrap.ps1
      - name: Подготовка (native-сборка и импорт ассетов)
        run: node godot/tools/test.cjs "$env:GODOT" --prepare-only
      - name: Сохранить кеш импорта
        if: steps.cache-import.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            godot/.godot/imported
            godot/.godot/editor
            godot/.godot/uid_cache.bin
            godot/.godot/global_script_class_cache.cfg
            godot/.godot/extension_list.cfg
          key: ${{ steps.cache-import.outputs.cache-primary-key }}
      - name: Сохранить кеш native-инструментов
        if: steps.cache-native-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist/godot/native-tools/
          key: ${{ steps.cache-native-tools.outputs.cache-primary-key }}
      - name: Сохранить кеш объектов native
        if: steps.cache-native-objects.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            dist/godot/native-build/
            godot/adapters/godot/native/bin/
          key: ${{ steps.cache-native-objects.outputs.cache-primary-key }}
      - name: Godot-тесты (в PR только затронутые правкой; ночью и по кнопке все)
        if: needs.changes.outputs.godot == 'true'
        shell: pwsh
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if ($env:BASE -and $env:BASE -notmatch '^0+$') { node godot/tools/test.cjs "$env:GODOT" --no-prepare "--changed=$env:BASE" } else { node godot/tools/test.cjs "$env:GODOT" --no-prepare }
      - if: needs.changes.outputs.godot == 'true'
        run: node godot/tools/release.cjs "$env:GODOT"
      - uses: actions/upload-artifact@v4
        if: always() && needs.changes.outputs.godot == 'true'
        with:
          name: windows-release-and-logs
          # Сборка весит ~130 МБ; держим 3 дня, чтобы не забивать хранилище Actions (#234).
          retention-days: 3
          path: |
            dist/godot/migration-release/
            godot/.godot/test-last-run.json
