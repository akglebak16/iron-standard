# Перерисовка графики из исходного JS-кода (canvas) в ветке. Запускается, когда в ветке меняется экспортёр,
# и по кнопке. Результат (PNG, .import, манифест, asset_paths) коммитится обратно в ту же ветку.
name: Godot — перерисовать графику
on:
  push:
    branches-ignore: [main]
    paths:
      - 'godot/tools/export_visuals.cjs'
      - '.github/workflows/visuals.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: visuals-${{ github.ref }}
  cancel-in-progress: true
jobs:
  faces:
    name: godot-visuals-faces
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Canvas для экспорта (только для этой задачи)
        run: npm install --no-save --no-audit --no-fund @napi-rs/canvas
      - name: Лица, шлемы и шеи героя и спутников
        run: node godot/tools/export_visuals.cjs --faces-only
      - name: Godot импортирует новые картинки
        run: |
          version=4.7.2
          curl -sSL -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/$version-stable/Godot_v$version-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          "$RUNNER_TEMP/godot/Godot_v$version-stable_linux.x86_64" --headless --path godot --import || true
      - run: node godot/tools/export_asset_paths.cjs
      - name: Закоммитить в ветку
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add godot/apps/godot/visuals/asset_paths.gd godot/apps/godot/visuals/assets/faces_* godot/apps/godot/visuals/assets/face_manifest.gd*
          git status --short
          if git diff --cached --quiet; then echo "Нечего коммитить"; exit 0; fi
          git commit -m "Godot: лица, шлемы и шеи героя и спутников (export_visuals.cjs --faces-only)"
          git push
